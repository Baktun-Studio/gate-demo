name: LineBreak Security Gate
on:
  pull_request:
# La compuerta publica en el PR un comentario con el motivo del bloqueo: necesita escribir en el PR.
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Baktun-Studio/linebreak-gate@v1.15.0
        with:
          stage: pr
      - name: Publicar la corrida en el panel de gobierno
        # Nunca bloquea el PR: si el servicio no responde, la corrida queda en el repositorio.
        if: always()
        continue-on-error: true
        env:
          LINEBREAK_GOVERNANCE_BASE_URL: ${{ secrets.LINEBREAK_GOVERNANCE_BASE_URL }}
          LINEBREAK_GOVERNANCE_TOKEN: ${{ secrets.LINEBREAK_GOVERNANCE_TOKEN }}
          LINEBREAK_GOV_PROJECT: prj_0df13d04d52be2c4
        run: linebreak-gate publish --stage pr
