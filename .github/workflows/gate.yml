name: LineBreak Security Gate
on:
  pull_request:
# La compuerta publica en el PR un comentario con el motivo del bloqueo: necesita escribir en el PR.
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Baktun-Studio/linebreak-gate@v1.15.0
